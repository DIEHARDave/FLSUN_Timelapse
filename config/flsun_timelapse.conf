# FLSUN_Timelapse - Moonraker settings
# install.sh copies this file to ~/printer_data/config/flsun_timelapse.conf
# once and never overwrites it, so edit that copy freely.
# Options: https://github.com/mainsail-crew/moonraker-timelapse/blob/main/docs/configuration.md

[timelapse]
output_path: ~/printer_data/timelapse/
frame_path: ~/printer_data/timelapse_frames/
ffmpeg_binary_path: /usr/local/bin/ffmpeg
# The T1 Pro's Cortex-A7 is slow; these keep rendering fast and light.
constant_rate_factor: 28
extraoutputparams: -preset ultrafast -bf 0 -tune fastdecode

[update_manager flsun_timelapse]
type: git_repo
primary_branch: main
path: ~/FLSUN_Timelapse
origin: https://github.com/DIEHARDave/FLSUN_Timelapse.git
managed_services: klipper moonraker
